<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f4498" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Marinekompanie" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <title>Marinekompanie Lank</title>
    <script>
      // „Desktop-Website“ im Handy-Browser: Chrome ignoriert dann das viewport-Tag und
      // legt die Seite 980 px breit an, die App erschiene winzig. Erkennbar daran, dass
      // die Seite auf einem Touch-Gerät viel breiter ist als der Bildschirm. Dann wird
      // die Seite so vergrößert, dass sie wieder genau Handybreite hat.
      (function () {
        var root = document.documentElement;
        function fit() {
          root.style.zoom = '';
          root.style.removeProperty('--mkl-zoom');
          if (!window.matchMedia || !matchMedia('(pointer: coarse)').matches) return;
          var landscape = matchMedia('(orientation: landscape)').matches;
          // iPhone meldet screen.width immer hochkant, Android passt es an die Drehung an.
          var screenW = landscape ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
          var layoutW = root.clientWidth;
          if (screenW > 0 && screenW < 1024 && layoutW > screenW * 1.15) {
            root.style.zoom = String(layoutW / screenW);
            // vw/vh wachsen mit „zoom“ mit; die Styles teilen dadurch wieder (styles.css).
            root.style.setProperty('--mkl-zoom', String(layoutW / screenW));
          }
        }
        // Im <head> steht die Breite oft noch nicht fest, deshalb auch nach dem Laden prüfen.
        fit();
        document.addEventListener('DOMContentLoaded', fit);
        window.addEventListener('load', fit);
        window.addEventListener('resize', fit);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
